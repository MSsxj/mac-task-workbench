<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F4F1">
<title>Mac 智能工作台</title>
<style>
/* ─────────────────────────────────────────────
   Mac 任务看板 · 值班仪表台 视觉方案
   原则：纸底、墨字、细线；状态色只表状态；无阴影、无圆角药丸
   ───────────────────────────────────────────── */
/* ─────────────────────────────────────────────
   配色：三组变量
   ① 纸/墨/线   ② 状态色   ③ 交互层（hover、反相字、遮罩）
   切换主题只改这三组，规则里不写具体颜色。
   ───────────────────────────────────────────── */
:root{
  --paper:#F4F4F1; --card:#FFFFFF;
  --ink:#14181C; --ink2:#4A545E; --ink3:#8A9299;
  --line:#D9DCD8; --line2:#E8EAE6;
  --ok:#2C6E49; --okbg:#EDF4EF;
  --warn:#8F6512; --warnbg:#FAF3E3;
  --bad:#A8332A; --badbg:#FAEEEC;
  --info:#27587F; --infobg:#EDF2F7;
  --gray:#6E767C; --graybg:#EFEFEC;
  /* 交互层：暗色下必须整套翻转，否则出白底白字 */
  --onink:#FFFFFF;          /* 反相块（主按钮/选中项）上的字 */
  --sel:#14181C;            /* 反相块的底：亮色用深墨 */
  --selhover:#2A3037;
  --hover:#EDEDE9;          /* 普通按钮 hover */
  --active:#E4E5E0;         /* 普通按钮按下 */
  --hov1:#FAFAF7;           /* 表格行、统计格 hover */
  --hov1a:#F2F2EE;          /* 表格行、统计格按下 */
  --hov2:#F5F5F1;           /* 分段控件、chip hover */
  --hov3:#F0F0EC;           /* 图标按钮 hover */
  --bordhover:#C9CCC6;
  --tick:#E8EAE6;           /* 进度条刻线，暗色下必须单独提亮 */
  --linkline:rgba(39,88,127,.28);
  --logbg:#FBFBF8; --logink:#2B3138;
  --mask:rgba(20,24,28,.26);
  --shadow:-18px 0 44px rgba(20,24,28,.10);
  --radius:2px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* 夜间仪表盘：深灰纸而非纯黑，状态色提亮但保持哑光，不用荧光色 */
html[data-theme=dark]{
  --paper:#15181B; --card:#1C2024;
  --ink:#E4E8E6; --ink2:#A6AFB6; --ink3:#8A949C;
  --line:#2C3238; --line2:#252A2F;
  --ok:#6DBE8C; --okbg:#16241C;
  --warn:#D6A642; --warnbg:#2A2115;
  --bad:#DE7A6D; --badbg:#2A1A18;
  --info:#7EAED6; --infobg:#17222B;
  --gray:#8C959C; --graybg:#23282D;
  --onink:#14181C;
  --sel:#CBD3CE;
  --selhover:#DAE0DC;
  --hover:#252B31;
  --active:#2B3239;
  --hov1:#21262B;
  --hov1a:#272D33;
  --hov2:#232930;
  --hov3:#242A30;
  --bordhover:#3E464E;
  --tick:#3B434A;
  --linkline:rgba(126,174,214,.34);
  --logbg:#12161A; --logink:#C4CDD3;
  --mask:rgba(0,0,0,.58);
  --shadow:-18px 0 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
html[data-theme=dark]{color-scheme:dark}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
a{color:var(--info);text-decoration:none;border-bottom:1px solid var(--linkline)}
a:hover{border-bottom-color:currentColor}
code{font-family:var(--mono);font-size:12px;background:var(--graybg);
     padding:1px 5px;border-radius:2px;color:var(--ink2)}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 64px}

/* ── 通用交互 ── */
button,input,select{font-family:inherit;font-size:13px;color:var(--ink)}
button{
  cursor:pointer;border:1px solid var(--line);background:var(--card);
  border-radius:var(--radius);padding:6px 13px;
  transition:background .12s,border-color .12s;
}
button:hover{background:var(--hover);border-color:var(--bordhover)}
button:active{background:var(--active)}
button:disabled{opacity:.5;cursor:progress}
button.primary{background:var(--sel);border-color:var(--sel);color:var(--onink)}
button.primary:hover{background:var(--selhover);border-color:var(--selhover)}
select,input[type=text]{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:6px 9px;
}
select:hover,input[type=text]:hover{border-color:var(--bordhover)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
tbody tr:focus-visible{outline:2px solid var(--info);outline-offset:-2px}

/* ── 报头 ── */
h1.title{font-size:17px;font-weight:600;margin:0;letter-spacing:.005em}
header.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px}
.title{font-size:17px;font-weight:600;letter-spacing:.005em}
.title small{display:inline-block;font-weight:400;color:var(--ink3);
  font-size:11.5px;margin-left:10px;letter-spacing:.02em}
/* 键盘跳转链接：平时藏起，聚焦时出现 */
.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--sel);
  color:var(--onink);padding:9px 16px;font-size:13px;border-radius:0 0 var(--radius) 0}
.skip:focus{left:0;top:0;color:var(--onink)}
.spacer{flex:1}
.meta{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
/* 配色切换：三段式，和筛选 tabs 同一套语言 */
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:none;border-right:1px solid var(--line);border-radius:0;
  background:var(--card);padding:6px 10px;font-size:12px;color:var(--ink2);line-height:1.6}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--hov2)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--onink);font-weight:600}
.seg button[aria-pressed=true]:hover{background:var(--selhover)}

/* ── 区块：去掉卡片外壳，用细线分节 ── */
.panel{background:transparent;border:none;box-shadow:none;margin-bottom:28px}
.panel-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:0 0 9px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.03em;color:var(--ink)}
.panel-b{padding:16px 0 0}

/* ── 读数带：四段等分；用 1px 间隙透出底线色，避免逐格画边框 ── */
.sysgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line)}
.syscard{background:var(--card);padding:16px 18px 15px;min-width:0}
.syscard .lab{font-size:11.5px;color:var(--ink3);letter-spacing:.05em}
.syscard .val{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;margin:8px 0 3px}
.syscard .val .u{font-size:12px;font-weight:500;color:var(--ink3);margin-left:3px;letter-spacing:0}
.syscard .sub{font-size:11.5px;color:var(--ink3);min-height:17px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.syscard.na .val{color:var(--ink3);font-size:17px;font-weight:500;letter-spacing:0}
.syscard.na .bar{display:none}
/* 标尺刻度：背景是等距刻线，填充是实色 —— 全页唯一的记忆点 */
.bar{height:6px;margin-top:12px;overflow:hidden;background:transparent;
  background-image:repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 7px)}
.bar > i{display:block;height:100%;border-radius:0;background:var(--ok);
  transition:width .3s ease,background .2s}
.srcnote{font-size:11px;color:var(--ink3);margin-top:12px;line-height:1.6}

/* ── 统计带：六段读数，不是六张卡 ── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line)}
.stat{background:var(--card);padding:14px 16px;cursor:pointer;
  transition:background .12s}
.stat:hover{background:var(--hov1)}
.stat:active{background:var(--hov1a)}
.stat .n{font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--ink3);margin-top:3px}
.stat.warn .n{color:var(--warn)}
.stat.bad .n{color:var(--bad)}
.stat.ok .n{color:var(--ok)}

/* ── 提示条：左侧实线，不是整块染色 ── */
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;
  border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius);
  font-size:12.5px;margin-bottom:10px;background:var(--card)}
.notice.bad{border-left-color:var(--bad);background:var(--badbg);color:var(--ink)}
.notice.warn{border-left-color:var(--warn);background:var(--warnbg);color:var(--ink)}
.notice.info{border-left-color:var(--info);background:var(--infobg);color:var(--ink)}
.notice .x{margin-left:auto;cursor:pointer;opacity:.45;padding:0 3px;
  background:none;border:none;font-size:16px;line-height:1}
.notice .x:hover{opacity:1;background:none}

/* ── 表格纸张 ── */
.panel.sheet{background:var(--card);border:1px solid var(--line)}
.panel.sheet > .panel-h{padding:14px 16px 13px;margin:0}
.panel.sheet > .panel-b{padding:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--line2)}
.tabs{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tabs button{border:none;border-right:1px solid var(--line);border-radius:0;
  background:var(--card);padding:6px 14px;font-size:12.5px;color:var(--ink2)}
.tabs button:last-child{border-right:none}
.tabs button:hover{background:var(--hov2)}
.tabs button.on{background:var(--sel);color:var(--onink);font-weight:600}
.tabs button.on:hover{background:var(--selhover)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
  padding:4px 11px;font-size:12px;color:var(--ink2)}
.chip:hover{background:var(--hov2);border-color:var(--bordhover)}
.chip.on{background:var(--sel);border-color:var(--sel);color:var(--onink)}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;padding:11px 14px;vertical-align:middle;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--ink3);letter-spacing:.04em;
  background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:1}
td{border-bottom:1px solid var(--line2);min-width:0}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--hov1)}
tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--ink)}
tbody tr:active{background:var(--hov1a)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm{font-weight:550;letter-spacing:-.003em}
.dim{color:var(--ink3)}
.sub2{display:block;font-size:11px;color:var(--ink3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--ink3);font-size:13px}
.tblwrap{max-height:none;overflow:visible}

/* ── 状态标记：色点 + 词，取消药丸底色 ── */
.badge{display:inline-flex;align-items:center;gap:6px;padding:0;border:none;
  background:none;border-radius:0;font-size:12.5px;line-height:1.6;
  color:var(--ink2);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:1px;
  background:currentColor;flex:none}
.b-ok{color:var(--ok)}
.b-bad{color:var(--bad)}
.b-warn{color:var(--warn)}
.b-info{color:var(--info)}
.b-gray{color:var(--gray)}
.b-run{color:var(--info)}
.badge[title]{cursor:help}

/* ── 抽屉 ── */
.mask{position:fixed;inset:0;background:var(--mask);opacity:0;
  pointer-events:none;transition:opacity .18s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,94vw);
  background:var(--card);border-left:1px solid var(--line);
  box-shadow:var(--shadow);
  transform:translateX(100%);transition:transform .22s ease;z-index:41;
  display:flex;flex-direction:column;overscroll-behavior:contain}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:flex-start;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--line)}
.dr-h h3{font-size:15px;margin:0;font-weight:600;line-height:1.45;word-break:break-all}
.dr-h .close{margin-left:auto;border:none;background:transparent;font-size:20px;
  line-height:1;color:var(--ink3);padding:2px 6px;border-radius:var(--radius)}
.dr-h .close:hover{background:var(--hov3);color:var(--ink)}
.dr-b{overflow:auto;padding:18px 20px 44px}
.dr-b h4{font-size:11.5px;margin:22px 0 9px;color:var(--ink3);
  font-weight:600;letter-spacing:.05em}
.dr-b h4:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:92px 1fr;gap:7px 12px;font-size:12.5px}
.kv .k{color:var(--ink3)}
.kv .v{word-break:break-word;font-variant-numeric:tabular-nums}
.logbox{background:var(--logbg);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;max-height:340px;overflow:auto;white-space:pre-wrap;
  font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--logink);
  overscroll-behavior:contain}
.logbox:empty::before{content:"暂无详细日志";color:var(--ink3)}
.srcrow{display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--line2)}
.srcrow:last-child{border-bottom:none}
.srcrow .lbl{font-size:12.5px}
.srcrow .why{font-size:11px;color:var(--ink3)}
.hint{font-size:11px;color:var(--ink3);line-height:1.65;margin-top:8px}
.foot{margin-top:30px;font-size:11px;color:var(--ink3);line-height:1.75;
  border-top:1px solid var(--line);padding-top:14px}

/* ── 响应式：靠改列数，不靠逐格边框 ── */
@media (max-width:1080px){
  .sysgrid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  .wrap{padding:18px 14px 48px}
  .title{font-size:16px}
  .title small{display:block;margin:3px 0 0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{gap:7px}
  .toolbar input[type=text]{width:100%!important}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line)}
  table{min-width:720px}
  .drawer{width:100%}
  .dr-b{padding:16px 16px 40px}
}
@media (max-width:520px){
  .sysgrid{grid-template-columns:1fr}
  .syscard{padding:14px 16px 13px}
  .syscard .val{font-size:26px;margin:6px 0 2px}
  .stat{padding:12px 14px}
  .stat .n{font-size:21px}
  .panel{margin-bottom:22px}
  .notice{padding:10px 12px;font-size:12px;line-height:1.55}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;
    animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>
<script>
/* 在样式生效之前定下明暗，避免首屏闪一下白 */
(function(){
  var m = 'auto';
  try{ m = localStorage.getItem('wb-theme') || 'auto'; }catch(_){}
  if(m !== 'light' && m !== 'dark') m = 'auto';
  var dark = m === 'dark' || (m === 'auto' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
  var r = document.documentElement;
  r.setAttribute('data-theme', dark ? 'dark' : 'light');
  r.setAttribute('data-pref', m);
})();
</script>
</head>
<body>
<a class="skip" href="#tasklist">跳到任务列表</a>
<div class="wrap">

  <header class="top">
    <h1 class="title">Mac 智能工作台 <small id="hostname"></small></h1>
    <div class="spacer"></div>
    <div class="meta" id="meta">正在读取…</div>
    <div class="seg" role="group" aria-label="配色模式">
      <button type="button" data-theme-set="auto" aria-pressed="true">自动</button>
      <button type="button" data-theme-set="light" aria-pressed="false">亮</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">暗</button>
    </div>
    <button id="btn-refresh" class="primary" type="button">刷新</button>
  </header>

  <div id="notices" aria-live="polite"></div>

  <!-- 一、系统状态 -->
  <section class="panel" style="margin-bottom:14px">
    <div class="panel-h">
      <h2>电脑状态</h2>
      <span class="dim" style="font-size:12px" id="sys-time">采集时间 —</span>
      <div class="spacer"></div>
      <label class="dim" style="font-size:12px">自动刷新
        <select id="sys-iv" style="margin-left:6px">
          <option value="15">15 秒</option>
          <option value="30" selected>30 秒</option>
          <option value="0">关闭</option>
        </select>
      </label>
    </div>
    <div class="panel-b">
      <div class="sysgrid" id="sysgrid">
        <div class="syscard"><div class="lab">CPU</div><div class="val">—</div><div class="sub">读取中…</div></div>
        <div class="syscard"><div class="lab">内存</div><div class="val">—</div><div class="sub">读取中…</div></div>
        <div class="syscard"><div class="lab">磁盘</div><div class="val">—</div><div class="sub">读取中…</div></div>
        <div class="syscard"><div class="lab">网络</div><div class="val">—</div><div class="sub">读取中…</div></div>
      </div>
      <div class="srcnote" id="sys-src"></div>
    </div>
  </section>

  <!-- 二、任务统计 -->
  <section class="panel" style="margin-bottom:14px">
    <div class="panel-h">
      <h2>自动任务概览</h2>
      <span class="dim" style="font-size:12px" id="runs-time"></span>
    </div>
    <div class="panel-b">
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <!-- 三、任务列表 -->
  <section class="panel sheet" id="tasklist">
    <div class="panel-h">
      <h2>任务列表</h2>
      <span class="dim" style="font-size:12px" id="list-count"></span>
    </div>
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button data-tab="all" class="on" type="button">全部</button>
        <button data-tab="local" type="button">Mac 本地</button>
        <button data-tab="wb" type="button">WorkBuddy</button>
      </div>
      <input type="text" id="q" placeholder="搜索任务名 / 归属 / 调度…" style="width:230px">
      <select id="f-vendor"><option value="">全部归属</option></select>
      <select id="f-state"><option value="">全部状态</option></select>
      <select id="f-run">
        <option value="">全部执行结果</option>
        <option value="failed">最近失败</option>
        <option value="ok">最近成功</option>
        <option value="missed">漏跑</option>
        <option value="none">无运行记录</option>
      </select>
      <button id="clear" type="button">清空筛选</button>
      <div class="spacer"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="tblwrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">没有符合条件的任务</div>
  </section>

  <div class="foot">
    数据来源：本机 <code>launchd</code> 配置（只读）+ WorkBuddy 本地任务库（只读，仅 id/名称/状态/计划）；
    运行结果来自 WorkBuddy 平台记录与本项目包装器日志。<br>
    说明：平台返回 SUCCESS 只代表该次运行按平台流程完成，<b>不等于业务结果已核对</b>；
    没有运行记录时一律显示「未提供运行记录」，不默认成功。状态分三类：配置状态、进程状态、最近执行结果，互不等同。<br>
    <span id="foot-detail"></span>
  </div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-h">
    <div>
      <h3 id="dr-title">—</h3>
      <div class="dim" style="font-size:12px;margin-top:3px" id="dr-sub"></div>
    </div>
    <button class="close" id="dr-close" type="button" aria-label="关闭">×</button>
  </div>
  <div class="dr-b" id="dr-body"></div>
</aside>

<script src="data/scan-data.js"></script>
<script src="data/automations.js"></script>
<script src="data/runs.js"></script>
<script src="data/state.js"></script>
<script>
(function(){
  "use strict";

  var S = window.__SCAN_DATA__ || null;
  var A = window.__AUTOMATIONS__ || null;
  var R = window.__RUNS__ || null;
  var ST = window.__STATE__ || null;
  var SYS = null;                 // 系统状态，来自 /api/sys

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };
  function pad(n){ return (n<10?'0':'')+n; }
  function fmtBytes(n){
    if(n==null) return '—';
    var u=['B','KB','MB','GB','TB'], i=0, v=Number(n);
    while(v>=1024 && i<u.length-1){ v/=1024; i++; }
    return (v>=100? v.toFixed(0) : v.toFixed(1)) + ' ' + u[i];
  }
  function fmtDT(s){
    if(!s) return '—';
    return String(s).replace('T',' ').slice(0,16);
  }
  function ageText(s){
    if(!s) return '';
    var t = new Date(String(s).replace(' ','T'));
    if(isNaN(t)) return '';
    var d = Math.floor((Date.now()-t.getTime())/60000);
    if(d < 1) return '刚刚';
    if(d < 60) return d+' 分钟前';
    if(d < 1440) return Math.floor(d/60)+' 小时前';
    return Math.floor(d/1440)+' 天前';
  }
  // 持续时长。常驻进程要说「已经跑了多久」，不是「多久以前」。
  function durText(sec){
    if(sec==null || isNaN(sec)) return '—';
    sec = Math.max(0, Math.floor(sec));
    if(sec < 60) return sec+' 秒';
    if(sec < 3600) return Math.floor(sec/60)+' 分钟';
    if(sec < 86400) return (sec/3600).toFixed(1)+' 小时';
    return (sec/86400).toFixed(1)+' 天';
  }

  /* ── 计划时间：rrule 翻成人话 ── */
  var DOW={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  var DN=['周日','周一','周二','周三','周四','周五','周六'];
  function scheduleText(rr){
    if(!rr) return '未设置';
    var d={};
    String(rr).split(';').forEach(function(p){
      var i=p.indexOf('='); if(i>0) d[p.slice(0,i).toUpperCase()]=p.slice(i+1);
    });
    var f=(d.FREQ||'').toUpperCase(), hh=d.BYHOUR, mm=d.BYMINUTE;
    var tm = (hh!=null? pad(+hh)+':'+pad(+(mm||0)) : '');
    if(f==='DAILY'){
      if(d.INTERVAL && +d.INTERVAL>1) return '每 '+d.INTERVAL+' 天 '+tm;
      return '每天 '+tm;
    }
    if(f==='WEEKLY'){
      var ds=(d.BYDAY||'').split(',').filter(Boolean).map(function(x){return DN[DOW[x]]||x;});
      var base = ds.length? '每'+ds.join('、') : '每周';
      if(d.INTERVAL && +d.INTERVAL>1) base = '每 '+d.INTERVAL+' 周（'+ds.join('、')+'）';
      return base + (tm? ' '+tm : '');
    }
    if(f==='MONTHLY'){
      return '每月 '+(d.BYMONTHDAY||'?')+' 日 '+tm;
    }
    if(f==='HOURLY'){
      return '每 '+(d.INTERVAL||1)+' 小时';
    }
    if(f==='YEARLY'){
      return '每年 '+(d.BYMONTH||'?')+' 月 '+(d.BYMONTHDAY||'?')+' 日 '+tm;
    }
    return String(rr);
  }

  /* ── 运行结果徽标 ── */
  var RUN_ST = {
    'SUCCESS':['b-ok','成功'],
    'FAILED':['b-bad','失败'],
    'RUNNING':['b-run','运行中'],
    'STALE':['b-warn','卡住'],
    'MISSED':['b-bad','漏跑'],
    'NOT_INSTRUMENTED':['b-gray','无记录']
  };
  function runBadge(st){
    var v=RUN_ST[st];
    return v? '<span class="badge '+v[0]+'">'+v[1]+'</span>'
            : '<span class="badge b-gray">未知</span>';
  }
  function prodTag(isProd, archived){
    if(archived) return ' <span class="badge b-gray" title="早期人工验证记录，已归档；只作历史参考，不参与生产判定">验证·归档</span>';
    return isProd===false? ' <span class="badge b-warn" title="dry-run / 试跑，不是生产运行">验证</span>' : '';
  }

  /* ══════════ 一、系统状态 ══════════ */
  function barColor(p){
    if(p==null) return 'var(--gray)';
    if(p>=90) return 'var(--bad)';
    if(p>=75) return 'var(--warn)';
    return 'var(--ok)';
  }
  function sysCard(icon, label, main, unit, sub, pct){
    var na = (main===null || main===undefined);
    var h = '<div class="syscard'+(na?' na':'')+'">';
    h += '<div class="lab">'+label+'</div>';
    h += '<div class="val">'+(na? '暂不可用' : esc(main)+(unit?'<span class="u">'+unit+'</span>':''))+'</div>';
    h += '<div class="sub">'+esc(sub||'')+'</div>';
    if(!na && pct!=null){
      h += '<div class="bar"><i style="width:'+Math.min(100,Math.max(0,pct))+'%;background:'+barColor(pct)+'"></i></div>';
    }
    return h+'</div>';
  }
  function renderSys(){
    var g = $('sysgrid');
    if(!SYS){
      g.innerHTML = sysCard('','CPU',null) + sysCard('','内存',null) +
                    sysCard('','磁盘',null) + sysCard('','网络',null);
      $('sys-time').textContent = '采集时间 —';
      $('sys-src').textContent = '系统状态读取失败，未显示任何推测值。';
      return;
    }
    var c=SYS.cpu, m=SYS.memory, d=SYS.disk, n=SYS.network;
    var h='';
    h += sysCard('','CPU', c? c.percent : null, '%',
                 c? (c.cores? c.cores+' 逻辑核' : '') : '采集失败',
                 c? c.percent : null);
    h += sysCard('','内存', m? Math.round(m.percent) : null, '%',
                 m? fmtBytes(m.used)+' / '+fmtBytes(m.total)+' 已用' : '采集失败',
                 m? m.percent : null);
    h += sysCard('','磁盘', d? Math.round(d.percent) : null, '%',
                 d? fmtBytes(d.used)+' / '+fmtBytes(d.total)+'，剩余 '+fmtBytes(d.free) : '采集失败',
                 d? d.percent : null);
    var netMain = n? (n.state==='online'?'正常': n.state==='limited'?'受限': n.state==='offline'?'未连接':'未知') : null;
    var netSub = n? (n.text + (n.interface? ' · '+n.interface : '')) : '采集失败';
    h += '<div class="syscard'+(n?'':' na')+'">'+
         '<div class="lab">网络</div>'+
         '<div class="val" style="font-size:'+(n?'22':'18')+'px;color:'+
           (n? (n.state==='online'?'var(--ok)': n.state==='offline'?'var(--bad)':'var(--warn)') : 'var(--ink3)')+'">'+
           esc(n? netMain : '暂不可用')+'</div>'+
         '<div class="sub">'+esc(netSub)+'</div>'+
         (n? '<div class="srcnote" style="margin-top:6px">'+esc(n.method||'')+
             (n.scope? ' · '+esc(n.scope):'')+'</div>' : '')+
         '</div>';
    g.innerHTML = h;

    $('sys-time').textContent = '采集时间 '+(SYS.collected_at||'—')+
      (SYS.elapsed_ms!=null? ' · '+SYS.elapsed_ms+'ms':'');
    var srcs=[];
    if(c) srcs.push('CPU：'+c.method);
    if(m) srcs.push('内存：'+m.method);
    if(d) srcs.push('磁盘：'+d.method);
    if(n) srcs.push('网络：'+n.method+(n.scope? '（'+n.scope+'）':''));
    $('sys-src').textContent = srcs.join('　｜　') || '部分指标不可用，未做任何估算替代。';
  }
  function loadSys(force){
    return fetch('api/sys', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok){ SYS = d.sys; sysFailedOnce = false; }
        else { SYS = null; sysFailedOnce = true; }
        renderSys(); renderNotices();
      })
      .catch(function(){ SYS = null; sysFailedOnce = true; renderSys(); renderNotices(); });
  }

  /* ══════════ 二、统计 ══════════ */
  function wbItems(){ return (A && A.items) || []; }
  function runSummary(){ return (R && R.summary) || {}; }
  function runTasks(){ return (R && R.tasks) || {}; }
  function taskRuns(id){ return runTasks()[id] || null; }

  function renderStats(){
    var localTotal = (S && S.counts && S.counts.total) || 0;
    var wbAll = wbItems();
    var wbActive = wbAll.filter(function(x){return x.status==='ACTIVE';}).length;
    var wbPaused = wbAll.filter(function(x){return x.status==='PAUSED';}).length;

    var lastOk=0, lastBad=0;
    wbAll.concat((S&&S.tasks)||[]).forEach(function(x){
      var t = taskRuns(x.id || x.label);
      var st = t && t.last && t.last.status;
      if(st==='SUCCESS') lastOk++;
      else if(st==='FAILED' || st==='MISSED') lastBad++;
    });

    var s = runSummary();
    var cells = [
      {k:'Mac 本地任务', n:localTotal, cls:'', go:'local'},
      {k:'WorkBuddy 任务', n:wbAll.length, cls:'', go:'wb'},
      {k:'已启用', n:wbActive, cls:'ok', go:'wbOn'},
      {k:'已暂停', n:wbPaused, cls:'', go:'wbOff'},
      {k:'最近成功', n:lastOk, cls:'ok', go:'runOk'},
      {k:'最近失败', n:lastBad, cls:(lastBad?'bad':''), go:'runBad'}
    ];
    $('stats').innerHTML = cells.map(function(c){
      return '<div class="stat '+c.cls+'" data-go="'+c.go+'">'+
             '<div class="n">'+c.n+'</div><div class="k">'+esc(c.k)+'</div></div>';
    }).join('');

    var rt = (R && R.generated_at) || '—';
    $('runs-time').textContent = '运行记录汇总于 '+rt+'　｜　共 '+(s.total||0)+' 条记录'+
      (s.VERIFICATION? '（含 ' + s.VERIFICATION + ' 条验证运行，不计入生产）':'');
    $('hostname').textContent = (S&&S.host)? S.host : '';
  }

  /* ══════════ 三、列表 ══════════ */
  var state = { tab:'all', q:'', vendor:'', sstate:'', run:'' };

  function localRows(){
    return ((S && S.tasks) || []).map(function(t){
      var rt = taskRuns(t.label);
      return {kind:'local', id:t.label, name:t.label, vendor:t.vendor||'—',
              schedule:t.schedule||'—', state:t.state||'未知', risk:t.risk||{},
              raw:t, run:rt};
    });
  }
  function wbRows(){
    return wbItems().map(function(a){
      return {kind:'wb', id:a.id, name:a.name, schedule:scheduleText(a.rrule),
              state:a.status==='ACTIVE'?'已启用':(a.status==='PAUSED'?'已暂停':a.status),
              raw:a, run:taskRuns(a.id)};
    });
  }
  function allRows(){ return localRows().concat(wbRows()); }

  /* 默认排序：配置为启用 / 正在跑的任务排最前。
     本机「运行中」= launchd 进程在跑；WorkBuddy「已启用」= 配置为启用，
     两个概念不同，但在「会不会自己跑起来」这件事上同组。
     同组内按最近执行时间倒序（跑过的、新的在前），再按名称。 */
  var STATE_RANK = {'运行中':0, '已启用':0, '等待中':1, '未运行':1, '已初始化':1,
                    '未加载':2, '已暂停':2};
  function stateRank(r){
    var k = STATE_RANK[r.state];
    return k == null ? 3 : k;
  }
  function lastTs(r){
    var l = r.run && r.run.last;
    if(!l) return 0;
    var s = l.started_at || l.ended_at;
    if(!s) return 0;
    var t = new Date(String(s).replace(' ','T')).getTime();
    return isNaN(t) ? 0 : t;
  }
  function sortRows(rows){
    return rows.slice().sort(function(a,b){
      var d = stateRank(a) - stateRank(b);
      if(d) return d;
      d = lastTs(b) - lastTs(a);
      if(d) return d;
      return String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
    });
  }

  function runCell(r){
    var t=r.run, l=t&&t.last;
    if(!l || l.status==='NOT_INSTRUMENTED'){
      // 本机任务没有包装器日志，但 launchd 本身有「累计启动次数 + 上次退出码」，
      // 这是能拿到的真实执行信号，不该丢掉，也不该说成「成功」。
      var raw=r.raw||{};
      if(r.kind==='local' && (raw.runs!=null || raw.last_exit!=null)){
        var rc = raw.last_exit;
        var bad = (rc!=null && String(rc)!=='0');
        var txt = (rc==null? '无退出码' : '退出码 '+(String(rc)==='0'?'0':'非 0'));
        return '<span class="badge '+(bad?'b-warn':'b-gray')+'">'+esc(txt)+'</span>'+
               '<span class="sub2">launchd：累计 '+esc(raw.runs==null?'—':raw.runs)+
               ' 次启动'+(bad? '，上次非正常退出':'')+'</span>';
      }
      return '<span class="badge b-gray">未提供运行记录</span>'+
             '<span class="sub2">无法确认是否执行，不默认成功</span>';
    }
    var st=l.status, sub='';
    if(st==='SUCCESS' || st==='FAILED'){
      sub = fmtDT(l.started_at) + (l.duration_ms!=null? ' · '+(l.duration_ms/1000).toFixed(1)+'s':'');
    } else if(st==='MISSED'){
      sub = '应跑 '+fmtDT(l.expected_at)+'，无记录';
    } else if(st==='STALE'){
      sub = '已 '+(l.stale_minutes||'?')+' 分钟未结束';
    } else if(st==='RUNNING'){
      sub = '进行中，尚未结束';
    }
    var title = l.error || '';
    return '<span title="'+esc(title)+'">'+runBadge(st)+prodTag(l.is_production)+'</span>'+
           '<span class="sub2">'+esc(sub)+'</span>';
  }

  function matchRunFilter(r){
    if(!state.run) return true;
    var l = r.run && r.run.last;
    var st = l && l.status;
    if(state.run==='failed') return st==='FAILED' || st==='MISSED';
    if(state.run==='ok') return st==='SUCCESS';
    if(state.run==='missed') return st==='MISSED';
    if(state.run==='none') return !l || st==='NOT_INSTRUMENTED';
    return true;
  }

  function filtered(){
    var q = state.q.trim().toLowerCase();
    return allRows().filter(function(r){
      if(state.tab==='local' && r.kind!=='local') return false;
      if(state.tab==='wb' && r.kind!=='wb') return false;
      if(state.vendor && r.kind==='local' && (r.vendor||'') !== state.vendor) return false;
      if(state.sstate && r.state !== state.sstate) return false;
      if(!matchRunFilter(r)) return false;
      if(q){
        var hay = [r.name, r.vendor, r.schedule, r.state].join(' ').toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function renderThead(){
    var h;
    if(state.tab==='wb'){
      h = '<th style="width:34%">任务名称</th><th style="width:12%">配置状态</th>'+
          '<th style="width:26%">计划执行</th><th style="width:28%">最近执行</th>';
    } else if(state.tab==='local'){
      h = '<th style="width:32%">任务名称</th><th style="width:16%">归属软件</th>'+
          '<th style="width:22%">调度方式</th><th style="width:12%">进程状态</th>'+
          '<th style="width:18%">最近执行</th>';
    } else {
      h = '<th style="width:30%">任务名称</th><th style="width:10%">类型</th>'+
          '<th style="width:22%">调度 / 计划</th><th style="width:10%">状态</th>'+
          '<th style="width:28%">最近执行</th>';
    }
    $('thead').innerHTML = h;
  }

  function renderList(){
    renderThead();
    var rows = sortRows(filtered());
    $('tbody').innerHTML = rows.map(function(r){
      var nameCell = '<td class="trunc"><span class="nm" title="'+esc(r.name)+'">'+esc(r.name)+'</span>'+
        (r.kind==='wb'? '<span class="sub2">'+esc(r.schedule)+'</span>' : '')+'</td>';
      var kindCell = '<td>'+(r.kind==='wb'? '<span class="badge b-info">平台</span>'
                                          : '<span class="badge b-gray">本机</span>')+'</td>';
      var mid;
      if(state.tab==='local'){
        mid = '<td class="trunc dim" title="'+esc(r.vendor)+'">'+esc(r.vendor)+'</td>'+
              '<td class="trunc" title="'+esc(r.schedule)+'">'+esc(r.schedule)+'</td>'+
              '<td>'+stateBadge(r.state)+'</td>';
      } else if(state.tab==='wb'){
        mid = '<td>'+stateBadge(r.state)+'</td>'+
              '<td class="trunc dim">'+esc(r.schedule)+'</td>';
      } else {
        mid = '<td class="trunc dim">'+esc(r.schedule)+'</td>'+
              '<td>'+stateBadge(r.state)+'</td>';
      }
      var tds = state.tab==='all'
        ? nameCell + '<td><span class="badge '+(r.kind==='wb'?'b-info':'b-gray')+'">'+
              (r.kind==='wb'?'平台':'本机')+'</span></td>' + 
              '<td class="trunc dim">'+esc(r.schedule)+'</td>' +
              '<td>'+stateBadge(r.state)+'</td>'
        : nameCell + mid;
      return '<tr data-kind="'+r.kind+'" data-id="'+esc(r.id)+'">'+tds+
             '<td>'+runCell(r)+'</td></tr>';
    }).join('');

    $('empty').style.display = rows.length? 'none' : 'block';
    $('list-count').textContent = '显示 '+rows.length+' / '+allRows().length+
      ' 条　·　已启用 / 运行中的排在前面，同组按最近执行时间倒序';
  }

  function stateBadge(s){
    if(s==='已启用'||s==='运行中') return '<span class="badge b-ok">'+esc(s)+'</span>';
    if(s==='已暂停') return '<span class="badge b-gray">'+esc(s)+'</span>';
    if(s==='未运行'||s==='未加载') return '<span class="badge b-gray">'+esc(s)+'</span>';
    if(s==='等待中'||s==='已初始化') return '<span class="badge b-info">'+esc(s)+'</span>';
    return '<span class="badge b-gray">'+esc(s||'未知')+'</span>';
  }

  function rebuildFilters(){
    var vs={}, ss={};
    localRows().forEach(function(r){ vs[r.vendor]=1; ss[r.state]=1; });
    var fv=$('f-vendor'), cur=fv.value;
    fv.innerHTML = '<option value="">全部归属</option>' +
      Object.keys(vs).sort().map(function(v){
        return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('');
    fv.value = cur;

    var fs=$('f-state'), cur2=fs.value;
    fs.innerHTML = '<option value="">全部状态</option>' +
      Object.keys(ss).sort().map(function(v){
        return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('');
    fs.value = cur2;
  }

  function renderChips(){
    var box=$('chips');
    var defs;
    if(state.tab==='wb'){
      defs=[{id:'',t:'全部'},{id:'on',t:'已启用'},{id:'off',t:'已暂停'}];
    } else if(state.tab==='local'){
      defs=[{id:'',t:'全部'},{id:'running',t:'运行中'},{id:'stopped',t:'未运行'}];
    } else {
      defs=[{id:'',t:'全部'}];
    }
    box.innerHTML = defs.map(function(d){
      var on = (d.id==='' && !state.sstate && !chipState) || (chipState===d.id);
      return '<span class="chip'+(on?' on':'')+'" data-chip="'+d.id+'">'+esc(d.t)+'</span>';
    }).join('');
  }
  var chipState='';

  /* ══════════ 详情抽屉 ══════════ */
  var curTask = null;

  function openTask(kind, id, name){
    curTask = {kind:kind, id:id, name:name};
    $('dr-title').textContent = name || id;
    $('dr-sub').textContent = (kind==='wb'? 'WorkBuddy 自动任务' : 'Mac 本地任务') + ' · ' + id;
    $('dr-body').innerHTML = '<div class="dim">正在读取运行记录…</div>';
    $('mask').classList.add('on');
    $('drawer').classList.add('on');
    $('drawer').setAttribute('aria-hidden','false');

    fetch('api/log?task_id='+encodeURIComponent(id), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){ renderDrawer(d); })
      .catch(function(){
        $('dr-body').innerHTML = '<div class="notice bad">读取失败：日志接口没有响应</div>';
      });
  }
  function closeTask(){
    $('mask').classList.remove('on');
    $('drawer').classList.remove('on');
    $('drawer').setAttribute('aria-hidden','true');
    curTask = null;
  }

  function statusText(st){
    return (RUN_ST[st]||[,'未知'])[1];
  }

  function renderDrawer(d){
    if(!d || !d.ok){
      $('dr-body').innerHTML = '<div class="notice bad">'+esc((d&&d.error)||'没有这个任务的记录')+'</div>';
      return;
    }
    var s = d.summary || {};
    var h = '';

    h += '<h4>运行摘要</h4>';
    h += '<div class="kv">';
    h += '<div class="k">最近执行</div><div class="v">'+esc(fmtDT(s.last_at))+
         (s.last_at? '　<span class="dim">('+esc(ageText(s.last_at))+')</span>':'')+'</div>';
    h += '<div class="k">结果</div><div class="v">'+runBadge(s.status)+
         (s.is_production===false? ' <span class="badge b-warn">验证运行，非生产</span>':'')+'</div>';
    h += '<div class="k">耗时</div><div class="v">'+
         (s.duration_ms!=null? (s.duration_ms/1000).toFixed(1)+' 秒':'未提供')+'</div>';
    if(s.ended_at) h += '<div class="k">结束时间</div><div class="v">'+esc(fmtDT(s.ended_at))+'</div>';
    if(s.expected_at) h += '<div class="k">计划时间</div><div class="v">'+esc(fmtDT(s.expected_at))+'</div>';
    h += '<div class="k">数据来源</div><div class="v">'+
         esc(s.source==='wb_db'? 'WorkBuddy 平台记录'
            : s.source==='wrapper'? '本项目包装器日志'
            : s.source || '无')+'</div>';
    if(s.trigger) h += '<div class="k">触发方式</div><div class="v">'+esc(s.trigger)+'</div>';
    if(s.rows!=null) h += '<div class="k">处理行数</div><div class="v">'+esc(s.rows)+' 行</div>';
    if(s.launchd){
      var ld=s.launchd;
      h += '<div class="k">进程状态</div><div class="v">'+stateBadge(ld.state||'未知')+'</div>';
      h += '<div class="k">launchd</div><div class="v">累计启动 '+
           esc(ld.runs==null?'未提供':ld.runs)+' 次'+
           (ld.last_exit!=null? '，上次退出码 '+esc(ld.last_exit):'')+
           '<span class="dim">（只有计数与退出码，无逐次历史）</span></div>';
      if(ld.schedule) h += '<div class="k">调度方式</div><div class="v">'+esc(ld.schedule)+'</div>';
      if(ld.vendor) h += '<div class="k">归属软件</div><div class="v">'+esc(ld.vendor)+'</div>';
    }
    h += '<div class="k">错误</div><div class="v">'+
         (s.error? '<span style="color:var(--bad)">'+esc(s.error)+'</span>' : '<span class="dim">无</span>')+'</div>';
    h += '</div>';

    // 常驻守护进程：launchd 只有「累计启动次数」，进程永不退出时这个数字没有信息量。
    // 真正可观测的是「中间有没有掉过」——由 collect.py 每轮比对 pid 生成。
    if(d.survival && d.survival.resident){
      var sv = d.survival;
      h += '<h4>存活变动<span class="dim" style="font-weight:400"> · 共 '+
           (sv.changes||0)+' 次</span></h4>';
      if(!sv.changes){
        h += '<div class="dim" style="font-size:13px">从 '+esc(fmtDT(sv.since))+
             ' 开始观测，期间未发生启停；当前状态已持续 '+durText(sv.uptime_seconds)+
             '。常驻进程不退出，所以 launchd 只有启动计数，没有逐次记录。</div>';
      } else {
        h += '<table style="table-layout:auto"><thead><tr>'+
             '<th style="width:38%">时间</th><th style="width:20%">变动</th><th>PID</th>'+
             '</tr></thead><tbody>'+
             (sv.events||[]).map(function(e){
               var pid = (e.prev_pid? esc(e.prev_pid) : '—')+' → '+(e.pid? esc(e.pid) : '—');
               return '<tr style="cursor:default">'+
                 '<td style="white-space:nowrap">'+esc(fmtDT(e.ts))+
                 ' <span class="dim">'+esc(ageText(e.ts))+'</span></td>'+
                 '<td>'+esc(e.label)+'</td>'+
                 '<td class="dim">'+pid+'</td></tr>';
             }).join('')+'</tbody></table>'+
             '<div class="hint">变动来自每轮采集对 PID 的比对（默认 5 分钟一轮）。'+
             '掉线不一定是故障：手动停用、软件升级、系统休眠恢复都会记成一次停止/启动。</div>';
      }
    }

    var t = runTasks()[d.task_id];
    var hist = (t && t.history) || [];
    var hasDry = hist.some(function(x){ return x.is_production === false; });

    h += '<h4>历史记录<span class="dim" style="font-weight:400"> · 共 '+
         (s.history_count||0)+' 条</span></h4>';
    if(hasDry){
      h += '<div class="hint" style="margin:-4px 0 8px">「最近执行」只取生产运行；'+
           '标「验证」的是 dry-run / 试跑记录，不会顶替生产结果。</div>';
    }
    if(!hist.length){
      var svHint = (d.survival && d.survival.resident)
        ? '这是常驻守护进程，运行期间不产生「结束」记录，可看上方「存活变动」。'
        : '';
      h += '<div class="dim" style="font-size:13px">该任务暂无运行记录。没有记录不等于成功，也不等于失败。'+svHint+'</div>';
    } else {
      h += '<table style="table-layout:auto"><thead><tr>'+
           '<th>开始</th><th>结果</th><th>耗时</th><th>来源</th><th>说明</th>'+
           '</tr></thead><tbody>'+
           hist.map(function(x){
             return '<tr style="cursor:default">'+
               '<td style="white-space:nowrap">'+esc(fmtDT(x.started_at))+'</td>'+
               '<td>'+runBadge(x.status)+prodTag(x.is_production, x.archived)+'</td>'+
               '<td>'+esc(x.duration_ms!=null? (x.duration_ms/1000).toFixed(1)+'s':'—')+'</td>'+
               '<td class="dim">'+esc(x.source==='wb_db'? '平台':'包装器')+'</td>'+
               '<td class="dim" style="word-break:break-word">'+esc(x.error||'—')+'</td></tr>';
           }).join('')+'</tbody></table>';
    }

    h += '<h4>日志来源</h4>';
    (d.sources||[]).forEach(function(src){
      h += '<div class="srcrow">'+
           '<button type="button" data-src="'+esc(src.id)+'"'+(src.available?'':' disabled')+'>'+
             (src.available? '查看详细日志' : '不可用')+'</button>'+
           '<div><div class="lbl">'+esc(src.label)+'</div>'+
           (src.reason? '<div class="why">'+esc(src.reason)+'</div>':'')+'</div>'+
           '</div>';
    });
    h += '<div class="hint">日志只从白名单内的文件读取，已脱敏（凭据、IP、邮箱、长数字串），最多 300 行。</div>';

    h += '<h4>详细日志</h4>';
    h += '<div class="logbox" id="logbox"></div>';
    h += '<div style="display:flex;gap:8px;margin-top:8px">'+
         '<button type="button" id="btn-copy">复制脱敏日志</button>'+
         '<span class="dim" style="font-size:12px;align-self:center" id="log-note"></span></div>';

    $('dr-body').innerHTML = h;

    var box = $('dr-body');
    box.querySelectorAll('button[data-src]').forEach(function(b){
      b.addEventListener('click', function(){
        loadLog(d.task_id, b.getAttribute('data-src'), b);
      });
    });
    $('btn-copy').addEventListener('click', copyLog);

    // 自动展开第一个可用来源，省一次点击
    var first = (d.sources||[]).filter(function(x){ return x.available; })[0];
    if(first) loadLog(d.task_id, first.id, box.querySelector('button[data-src="'+first.id+'"]'));
  }

  var lastLogText = '';
  function loadLog(taskId, source, btn){
    var box = $('logbox');
    if(!box) return;
    box.textContent = '正在读取…';
    $('log-note').textContent = '';
    fetch('api/log?task_id='+encodeURIComponent(taskId)+'&source='+encodeURIComponent(source),
          {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.ok){
          box.textContent = '暂无详细日志：' + (d.error||'读取失败');
          lastLogText = '';
          return;
        }
        var txt = (d.lines||[]).join('\n');
        if(!txt){ box.textContent = '暂无详细日志'; lastLogText=''; return; }
        box.textContent = txt;
        lastLogText = txt;
        $('log-note').textContent = (d.truncated? '已截断，仅显示最近部分' : '') +
                                    (d.reason? ' ' + d.reason : '');
        box.scrollTop = box.scrollHeight;
      })
      .catch(function(){ box.textContent = '暂无详细日志：接口无响应'; });
  }

  function copyLog(){
    var txt = lastLogText || ($('logbox') && $('logbox').textContent) || '';
    if(!txt || txt==='暂无详细日志'){ $('log-note').textContent='没有可复制的内容'; return; }
    var done = function(){ $('log-note').textContent = '已复制（脱敏后的内容）'; };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
    } else { fallbackCopy(txt, done); }
  }
  function fallbackCopy(txt, cb){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); cb(); }catch(e){}
    document.body.removeChild(ta);
  }

  /* ══════════ 提示条 ══════════ */
  var dismissed = {};
  function renderNotices(){
    var items=[];
    // 1) 采集器心跳
    if(ST && ST.collected_at){
      var mins = Math.floor((Date.now() - new Date(String(ST.collected_at).replace(' ','T')).getTime())/60000);
      if(mins > 30){
        items.push({k:'warn', t:'采集器已 '+mins+' 分钟没有更新（最后 '+ST.collected_at+
          '），下面的数据可能不是最新的。'});
      }
    } else {
      items.push({k:'info', t:'尚未收到采集器心跳。任务与运行记录仍可看，但不会自动更新（打开页面会刷一次）。'});
    }
    if(ST && ST.health && ST.health.db_ok===false){
      items.push({k:'warn', t:'读不到 WorkBuddy 运行记录数据库，运行历史可能不完整。'});
    }
    // 2) 最近运行异常：失败/漏跑都列出来，已暂停的单独标注，避免和「最近失败」数字对不上
    var bad=[];
    wbItems().forEach(function(a){
      var t=runTasks()[a.id], l=t&&t.last;
      if(!l || (l.status!=='FAILED' && l.status!=='MISSED')) return;
      bad.push({id:a.id, name:t.name||a.name, st:l.status, at:l.started_at,
                err:l.error, paused:(a.status!=='ACTIVE')});
    });
    bad.forEach(function(b){
      var tail = (b.at? ' · ' + fmtDT(b.at) : '') + (b.err? ' · ' + b.err : '');
      items.push({k: b.paused? 'warn' : 'bad',
        t:'最近运行' + statusText(b.st) + '：' + b.name +
          (b.paused? '（该任务当前已暂停）':'') + tail});
    });
    // 3) 扫描/采集错误
    if(S && S.errors && S.errors.length){
      items.push({k:'warn', t:'本机任务扫描有 '+S.errors.length+' 项异常（个别 plist 无法解析）'});
    }
    if(SYS===null && !sysFailedOnce){
      // 首次加载还没结果时不报错
    } else if(SYS===null){
      items.push({k:'warn', t:'系统状态采集失败，CPU / 内存 / 磁盘 / 网络显示为「暂不可用」。'});
    }

    var box=$('notices');
    box.innerHTML = items.map(function(it,i){
      if(dismissed[it.t]) return '';
      return '<div class="notice '+it.k+'"><span>'+esc(it.t)+'</span>'+
             '<span class="x" data-i="'+i+'" title="隐藏">×</span></div>';
    }).join('');
    box.querySelectorAll('.x').forEach(function(x){
      x.addEventListener('click', function(){
        dismissed[items[+x.getAttribute('data-i')].t]=1;
        x.parentNode.style.display='none';
      });
    });
  }

  /* ══════════ 刷新 ══════════ */
  var busy=false, sysFailedOnce=false;
  function setBusy(b){
    busy=b;
    $('btn-refresh').disabled=b;
    $('btn-refresh').textContent = b? '刷新中…' : '刷新';
  }
  function applyPayload(d){
    if(d.system) S=d.system;
    if(d.automations) A=d.automations;
    if(d.runs) R=d.runs;
    if(d.state) ST=d.state;
    renderStats(); rebuildFilters(); renderList(); renderNotices();
    $('meta').textContent = '任务数据 ' + ((S&&S.generated_at)||'—') +
      '　·　运行记录 ' + ((R&&R.generated_at)||'—');
  }
  function doRefresh(){
    if(busy) return;
    setBusy(true);
    fetch('api/refresh', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok){
          applyPayload(d);
        } else {
          // 失败：保留旧数据，只提示
          renderNotices();
          $('meta').textContent = '刷新失败（显示的是 ' + ((S&&S.generated_at)||'上次') + ' 的数据）';
        }
      })
      .catch(function(){
        $('meta').textContent = '刷新失败：本机服务没有响应（保留上次数据）';
      })
      .finally(function(){ setBusy(false); });
  }

  /* ══════════ 事件 ══════════ */
  $('btn-refresh').addEventListener('click', function(){ doRefresh(); loadSys(true); });

  $('tabs').addEventListener('click', function(e){
    var b=e.target.closest('button[data-tab]'); if(!b) return;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    state.tab=b.getAttribute('data-tab');
    state.sstate=''; chipState='';
    renderChips(); renderList();
  });
  $('q').addEventListener('input', function(){ state.q=this.value; renderList(); });
  $('f-vendor').addEventListener('change', function(){ state.vendor=this.value; renderList(); });
  $('f-state').addEventListener('change', function(){ state.sstate=this.value; renderList(); });
  $('f-run').addEventListener('change', function(){ state.run=this.value; renderList(); });
  $('clear').addEventListener('click', function(){
    state.q=''; state.vendor=''; state.sstate=''; state.run=''; chipState='';
    $('q').value=''; $('f-vendor').value=''; $('f-state').value=''; $('f-run').value='';
    renderChips(); renderList();
  });
  $('chips').addEventListener('click', function(e){
    var c=e.target.closest('[data-chip]'); if(!c) return;
    chipState=c.getAttribute('data-chip');
    if(!chipState){ state.sstate=''; }
    else if(chipState==='on'){ state.sstate='已启用'; }
    else if(chipState==='off'){ state.sstate='已暂停'; }
    else if(chipState==='running'){ state.sstate='运行中'; }
    else if(chipState==='stopped'){ state.sstate='未运行'; }
    $('f-state').value = state.sstate;
    renderChips(); renderList();
  });
  $('tbody').addEventListener('click', function(e){
    var tr=e.target.closest('tr[data-id]'); if(!tr) return;
    var id=tr.getAttribute('data-id'), kind=tr.getAttribute('data-kind');
    var name = tr.querySelector('.nm') ? tr.querySelector('.nm').textContent : id;
    openTask(kind, id, name);
  });
  $('stats').addEventListener('click', function(e){
    var c=e.target.closest('[data-go]'); if(!c) return;
    var g=c.getAttribute('data-go');
    if(g==='local'){ setTab('local'); }
    else if(g==='wb'){ setTab('wb'); }
    else if(g==='wbOn'){ setTab('wb'); state.sstate='已启用'; $('f-state').value='已启用'; renderList(); }
    else if(g==='wbOff'){ setTab('wb'); state.sstate='已暂停'; $('f-state').value='已暂停'; renderList(); }
    else if(g==='runOk'){ state.run='ok'; $('f-run').value='ok'; renderList(); }
    else if(g==='runBad'){ state.run='failed'; $('f-run').value='failed'; renderList(); }
  });
  function setTab(t){
    state.tab=t; state.sstate=''; chipState='';
    $('f-state').value='';
    Array.prototype.forEach.call($('tabs').children, function(x){
      x.classList.toggle('on', x.getAttribute('data-tab')===t);
    });
    renderChips(); renderList();
  }

  $('dr-close').addEventListener('click', closeTask);
  $('mask').addEventListener('click', closeTask);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') closeTask();
  });

  /* 系统状态定时刷新（与任务列表解耦） */
  var sysTimer=null;
  function scheduleSys(){
    if(sysTimer) clearInterval(sysTimer);
    var sec=parseInt($('sys-iv').value,10)||0;
    if(sec>0){
      sysTimer=setInterval(function(){ loadSys(); }, sec*1000);
    }
  }
  $('sys-iv').addEventListener('change', function(){
    try{ localStorage.setItem('wb_sys_iv', this.value); }catch(e){}
    scheduleSys();
  });

  /* 切回页面时补一次系统状态 */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible') loadSys();
  });

  /* ══════════ 首次渲染 ══════════ */
  try{
    var saved = localStorage.getItem('wb_sys_iv');
    if(saved!==null) $('sys-iv').value = saved;
  }catch(e){}

  renderStats(); rebuildFilters(); renderChips(); renderList(); renderNotices();
  $('meta').textContent = '任务数据 ' + ((S&&S.generated_at)||'—') +
      '　·　运行记录 ' + ((R&&R.generated_at)||'—');

  loadSys();
  scheduleSys();

  // 支持 ?task=<id> 直接打开某个任务的详情（方便收藏/排查时直达）
  try{
    var qp = new URLSearchParams(location.search);
    var t0 = qp.get('task');
    if(t0){
      var hit = allRows().filter(function(r){ return r.id===t0; })[0];
      if(hit) openTask(hit.kind, hit.id, hit.name);
    }
  }catch(e){}

  // 打开页面先刷一次任务数据（需求要求「打开时自动刷新」，不依赖采集器是否装好）
  doRefresh();
})();
</script>

<script>
/* ── 预览版增强：只做叠加，不触碰原有渲染逻辑 ── */
(function(){
  "use strict";
  var tb = document.getElementById('tbody');
  if(!tb) return;

  // 表格行原本只能鼠标点，这里补上键盘可达（Tab 聚焦 + Enter 打开）
  function markRows(){
    Array.prototype.forEach.call(tb.querySelectorAll('tr'), function(tr){
      if(!tr.hasAttribute('tabindex')){
        tr.setAttribute('tabindex','0');
        tr.setAttribute('role','button');
        tr.setAttribute('aria-label','查看任务详情：' + (tr.querySelector('.nm')||tr).textContent.trim());
      }
    });
  }
  new MutationObserver(markRows).observe(tb, {childList:true});
  markRows();

  // 提示条的关闭键原本是 span，改成可聚焦的按钮
  var nb = document.getElementById('notices');
  if(nb){
    new MutationObserver(function(){
      Array.prototype.forEach.call(nb.querySelectorAll('.x'), function(el){
        if(el.tagName === 'SPAN'){
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'x';
          b.setAttribute('aria-label','隐藏这条提示');
          b.innerHTML = '×';
          b.addEventListener('click', function(e){
            e.stopPropagation();
            el.dispatchEvent(new MouseEvent('click', {bubbles:true}));
          });
          el.replaceWith(b);
        }
      });
    }).observe(nb, {childList:true, subtree:true});
  }

  // 表单控件补可读名称（原来只有首项文字当标签）
  var labels = {'q':'搜索任务','f-vendor':'按归属筛选','f-state':'按状态筛选',
                'f-run':'按执行结果筛选','sys-iv':'自动刷新间隔'};
  Object.keys(labels).forEach(function(id){
    var el = document.getElementById(id);
    if(el && !el.getAttribute('aria-label')) el.setAttribute('aria-label', labels[id]);
  });

  tb.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var tr = e.target.closest('tr');
    if(!tr) return;
    e.preventDefault();
    tr.click();
  });

  // 抽屉打开时把焦点移进去，关闭后归还，避免焦点留在页面外
  var drawer = document.getElementById('drawer');
  var lastFocus = null;
  if(drawer){
    new MutationObserver(function(){
      var open = drawer.classList.contains('on');
      if(open && !lastFocus){
        lastFocus = document.activeElement;
        var c = drawer.querySelector('.close');
        if(c) c.focus();
      } else if(!open && lastFocus){
        try{ lastFocus.focus(); }catch(_){}
        lastFocus = null;
      }
    }).observe(drawer, {attributes:true, attributeFilter:['class']});
  }
})();
</script>

<script>
/* ── 配色切换 ───────────────────────────────────────────
   三档：自动（跟随系统）/ 亮 / 暗。选择写进 localStorage。
   '自动' 下监听系统变化，切换后即时跟随。          */
(function(){
  var KEY = 'wb-theme';
  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var metaTag = document.querySelector('meta[name="theme-color"]');
  var btns = document.querySelectorAll('[data-theme-set]');

  function currentPref(){
    var p = root.getAttribute('data-pref');
    return (p === 'light' || p === 'dark') ? p : 'auto';
  }
  function paint(p, persist){
    var dark = (p === 'dark') || (p === 'auto' && !!mq && mq.matches);
    root.setAttribute('data-pref', p);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    if(metaTag) metaTag.setAttribute('content', dark ? '#15181B' : '#F4F4F1');
    for(var i = 0; i < btns.length; i++){
      btns[i].setAttribute('aria-pressed',
        btns[i].getAttribute('data-theme-set') === p ? 'true' : 'false');
    }
    if(persist){
      try{ localStorage.setItem(KEY, p); }catch(_){}
    }
  }

  paint(currentPref(), false);

  document.addEventListener('click', function(e){
    var el = e.target;
    while(el && el !== document.body){
      if(el.getAttribute && el.hasAttribute('data-theme-set')){
        paint(el.getAttribute('data-theme-set'), true);
        return;
      }
      el = el.parentNode;
    }
  });

  // 选「自动」时，系统跟着变，页面也变
  var onSysChange = function(){ if(currentPref() === 'auto') paint('auto', false); };
  if(mq){
    if(mq.addEventListener) mq.addEventListener('change', onSysChange);
    else if(mq.addListener) mq.addListener(onSysChange);
  }
})();
</script>
</body>
</html>
